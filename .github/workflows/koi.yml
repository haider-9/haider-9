name: Update Koi

on:
  schedule:
    - cron: '0 0 * * *' # Runs every night at midnight
  workflow_dispatch: # Allows manual trigger

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Submit Koi Activity
        uses: gayanvoice/git-profile-koi@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
